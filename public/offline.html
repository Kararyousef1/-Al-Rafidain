<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غير متصل — الرافدين HR</title>
  <meta name="theme-color" content="#4f46e5" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', 'Cairo', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      max-width: 440px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.5rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 48px; height: 48px; }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      line-height: 1.7;
      opacity: 0.85;
      margin-bottom: 2rem;
    }
    button {
      background: #fff;
      color: #4f46e5;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3); }
    button:active { transform: translateY(0); }
    .hint { font-size: 0.8rem; opacity: 0.6; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>لا يمكن الوصول إلى النظام حالياً. تحقّق من اتصالك بالإنترنت ثم حاول مرة أخرى.</p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
    <p class="hint">سيتم استعادة الوصول تلقائياً عند عودة الاتصال</p>
  </div>
  <script>
    // إعادة التحميل تلقائياً عند عودة الاتصال
    window.addEventListener('online', () => window.location.reload());
  </script>
