<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وادي الرافدين - نظام إدارة الموارد البشرية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; padding: 0; }
      .pre-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Tajawal', sans-serif;
        background: #f8fafc;
      }
      .pre-loader-content { text-align: center; }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      .loader-text { color: #64748b; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-loader">
        <div class="pre-loader-content">
          <div class="spinner"></div>
          <p class="loader-text">جاري التحميل...</p>
        </div>
      </div>
    </div>
    <!--
      GitHub Pages يستخدم هذا الملف كصفحة 404.
      الـ workflow ينسخ dist/index.html -> dist/404.html تلقائياً.
      هذا الملف يعرض شاشة تحميل فقط؛ الـ script الفعلي يتم حقنه من index.html.
    -->
  </body>
</html>
