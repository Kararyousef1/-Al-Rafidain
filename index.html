<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══ Responsive Viewport ═══ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ═══ Title & Description ═══ -->
    <title>KOFRX - وادي الرافدين - نظام إدارة الموارد البشرية</title>
    <meta
      name="description"
      content="منصة الموارد البشرية المتكاملة — الحضور، الإجازات، البلاغات، التدريب، والعافية في مكان واحد."
    />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: Theme Color                                            -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta name="theme-color" content="#0a0e27" />
    <meta name="theme-color" content="#0a0e27" media="(prefers-color-scheme: dark)" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: Manifest                                               -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: iOS / Safari Support                                   -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الرافدين HR" />
    <meta name="application-name" content="الرافدين HR" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Favicon + Icons                                             -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Open Graph / Social Media                                   -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KOFRX - وادي الرافدين - نظام إدارة الموارد البشرية" />
    <meta
      property="og:description"
      content="منصة الموارد البشرية المتكاملة — الحضور، الإجازات، البلاغات، التدريب، والعافية."
    />
    <meta property="og:image" content="/icon.svg" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Fonts — preconnect + preload الخطوط الثلاثة                -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- preload للأوزان الأكثر استخداماً -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ═══ منع FOUC + KOFRX Splash أولي ═══ -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');

      html {
        font-family: 'Tajawal', 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        background-color: #0a0e27;
      }
      /* KOFRX Splash قبل تحميل React */
      #root:empty::before {
        content: 'KOFRX';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Orbitron', sans-serif;
        font-size: 5rem;
        font-weight: 900;
        letter-spacing: 0.15em;
        background: linear-gradient(135deg, #ffffff 0%, #00d4ff 50%, #0066ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 40px rgba(0,212,255,0.5), 0 0 80px rgba(0,102,255,0.3);
        animation: kofrx-glow 3s ease-in-out infinite;
      }
      /* خط مضيء تحت النص */
      #root:empty::after {
        content: '';
        position: fixed;
        top: calc(50% + 60px);
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, #0066ff 50%, transparent 100%);
        box-shadow: 0 0 10px #0066ff, 0 0 20px rgba(0,102,255,0.5);
        animation: kofrx-line 2s ease-in-out infinite;
      }
      @keyframes kofrx-glow {
        0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(0,212,255,0.6)); }
        50% { filter: brightness(1.3) drop-shadow(0 0 40px rgba(0,212,255,0.9)); }
      }
      @keyframes kofrx-line {
        0%, 100% { width: 200px; opacity: 0.6; }
        50% { width: 350px; opacity: 1; }
      }
      @media (max-width: 768px) {
        #root:empty::before { font-size: 3rem; }
      }
      @media (max-width: 480px) {
        #root:empty::before { font-size: 2.5rem; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      ملاحظة: تم إزالة سكريبت Cloudflare Challenge Platform المجهول
      الذي كان موجوداً في السابق. إذا كنت بحاجة لحماية CF، فعّلها
      من لوحة تحكم Cloudflare مباشرةً وليس عبر كود مضمّن يدوياً.
    -->
  </body>
</html>
