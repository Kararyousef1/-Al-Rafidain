<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══ Responsive Viewport ═══ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ═══ Title & Description ═══ -->
    <title>وادي الرافدين - نظام إدارة الموارد البشرية</title>
    <meta
      name="description"
      content="منصة الموارد البشرية المتكاملة — الحضور، الإجازات، البلاغات، التدريب، والعافية في مكان واحد."
    />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: Theme Color                                            -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: Manifest                                               -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: iOS / Safari Support                                   -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الرافدين HR" />
    <meta name="application-name" content="الرافدين HR" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Favicon + Icons                                             -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Open Graph / Social Media                                   -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="وادي الرافدين - نظام إدارة الموارد البشرية" />
    <meta
      property="og:description"
      content="منصة الموارد البشرية المتكاملة — الحضور، الإجازات، البلاغات، التدريب، والعافية."
    />
    <meta property="og:image" content="/icon.svg" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Fonts — preconnect + preload الخط الأساسي                  -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- preload للوزن الأكثر استخداماً (400) لتفادي FOUC -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ═══ منع FOUC + Loading Spinner أولي ═══ -->
    <style>
      html {
        font-family: 'Tajawal', 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        background-color: #f8fafc;
      }
      /* Spinner قبل تحميل React */
      #root:empty::before {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border: 4px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      /* Progress bar تحت الـ spinner */
      #root:empty::after {
        content: '';
        position: fixed;
        top: calc(50% + 40px);
        left: 50%;
        width: 120px;
        height: 3px;
        margin-left: -60px;
        background: #e2e8f0;
        border-radius: 2px;
        overflow: hidden;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      ملاحظة: تم إزالة سكريبت Cloudflare Challenge Platform المجهول
      الذي كان موجوداً في السابق. إذا كنت بحاجة لحماية CF، فعّلها
      من لوحة تحكم Cloudflare مباشرةً وليس عبر كود مضمّن يدوياً.
    -->
  </body>
</html>
