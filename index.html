<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══ Responsive Viewport ═══ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ═══ Title & Description ═══ -->
    <title>وادي الرافدين - نظام إدارة الموارد البشرية</title>
    <meta
      name="description"
      content="منصة الموارد البشرية المتكاملة — الحضور، الإجازات، البلاغات، التدريب، والعافية في مكان واحد."
    />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: Theme Color (الشريط يأخذ لون الهوية)                   -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: Manifest (قابل للتثبيت كتطبيق)                         -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PWA: iOS / Safari Support (مهم جداً للآيفون)                 -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الرافدين HR" />
    <meta name="application-name" content="الرافدين HR" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Favicon + Icons                                             -->
    <!--  (SVG أولاً للشاشات الحديثة، PNG احتياطي)                      -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Open Graph / Social Media (مشاركة الروابط)                  -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="وادي الرافدين - نظام إدارة الموارد البشرية" />
    <meta
      property="og:description"
      content="منصة الموارد البشرية المتكاملة — الحضور، الإجازات، البلاغات، التدريب، والعافية."
    />
    <meta property="og:image" content="/icon.svg" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Fonts (تم إصلاح روابط markdown المكسورة)                    -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ═══ منع وميض FOUC (الخط الافتراضي قبل تحميل Cairo/Tajawal) ═══ -->
    <style>
      html {
        font-family: 'Tajawal', 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        background-color: #f8fafc;
      }
      /* منع وميض التحميل الأولي */
      #root:empty::before {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border: 4px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

    <div id="root"></div>

    <!-- ═══ نقطة دخول التطبيق ═══ -->
