name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# السماح بنشر واحد فقط في كل مرة، وإلغاء أي deploy سابق
concurrency:
  group: "pages"
  cancel-in-progress: true

# صلاحيات GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Node & npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Build project
        run: npm run build
        env:
          CI: true

      - name: Verify build output
        run: |
          echo "=== Checking dist folder ==="
          ls -la dist/
          echo "=== Checking dist/index.html ==="
          if [ -f dist/index.html ]; then
            echo "dist/index.html exists ✓"
            head -c 500 dist/index.html
          else
            echo "ERROR: dist/index.html missing!"
            exit 1
          fi

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
